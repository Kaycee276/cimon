[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "paris"        # no PUSH0, safest default for a new EVM L2
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[invariant]
runs = 64
depth = 40
fail_on_revert = false
